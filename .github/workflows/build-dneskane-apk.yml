name: Build DneskaNe APK

on:
  workflow_dispatch:
  push:
    branches: [ "android-dneskane", "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf DneskaNe
          unzip -q DneskaNe-source.zip
          ls -la DneskaNe

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: DneskaNe
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DneskaNe-debug-apk
          path: DneskaNe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
